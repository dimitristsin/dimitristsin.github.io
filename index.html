<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrios Tsintsilidas Webpage</title>
    <!-- Link to your CSS file -->
    <link rel="stylesheet" href="style.css">

<!-- MathJax for LaTeX support -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

<!-- Icon Libraries for Email, Scholar, and ORCID -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <!-- Redesign experiment: visual refinement of the existing orbit only -->
    <style>
        .orbit-path {
            width: 64vmin;
            height: 64vmin;
            border-width: 1px;
            border-color: rgba(154, 178, 255, 0.20);
            box-shadow: 0 0 26px rgba(130, 160, 255, 0.035);
        }

        .pos-1 { transform: rotate(240deg) translate(32vmin) rotate(-240deg); }
        .pos-2 { transform: rotate(300deg) translate(32vmin) rotate(-300deg); }
        .pos-3 { transform: rotate(0deg) translate(32vmin) rotate(0deg); }
        .pos-4 { transform: rotate(60deg) translate(32vmin) rotate(-60deg); }
        .pos-5 { transform: rotate(120deg) translate(32vmin) rotate(-120deg); }
        .pos-6 { transform: rotate(180deg) translate(32vmin) rotate(-180deg); }

        .orbit-disc {
            width: 22.5vmin;
            height: 22.5vmin;
            padding: 16px;
            background: linear-gradient(145deg, rgba(35, 43, 72, 0.94), rgba(39, 31, 53, 0.94));
            border: 1px solid rgba(175, 190, 235, 0.18);
            box-shadow:
                0 10px 28px rgba(0, 0, 0, 0.28),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            font-size: clamp(0.72rem, 2.25vw, 1.08rem);
            letter-spacing: 0.035em;
            transition:
                transform 0.28s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.28s ease,
                box-shadow 0.28s ease,
                border-color 0.28s ease;
        }

        .orbit-disc:hover {
            transform: scale(1.055);
            background: linear-gradient(145deg, rgba(45, 55, 92, 0.98), rgba(55, 38, 69, 0.98));
            border-color: rgba(180, 196, 255, 0.42);
            box-shadow:
                0 14px 34px rgba(0, 0, 0, 0.32),
                0 0 20px rgba(130, 160, 255, 0.09),
                inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .orbit-disc:active {
            transform: scale(0.985);
            box-shadow: 0 7px 20px rgba(0, 0, 0, 0.28);
        }

        @media (max-width: 700px) {
            .orbit-disc {
                width: 23vmin;
                height: 23vmin;
                min-width: 78px;
                min-height: 78px;
                padding: 10px;
            }
        }
    </style>

</head>
<body>

    <!-- Main Page Title (Top Left) -->
    <h1 class="main-title">Dimitrios Tsintsilidas</h1>

    <!-- The Animated Background Canvas -->
    <canvas id="particle-canvas"></canvas>

    <!-- Radial Navigation -->
    <div class="radial-nav-container">
        <div class="orbit-path"></div>
        
        <div class="disc-wrapper pos-1">
            <button class="orbit-disc" onclick="openWindow('About')">About</button>
        </div>
        <div class="disc-wrapper pos-2">
            <button class="orbit-disc" onclick="openWindow('Research')">Research</button>
        </div>
        <div class="disc-wrapper pos-3">
            <button class="orbit-disc" onclick="openWindow('Publications')">Publications</button>
        </div>
        <div class="disc-wrapper pos-4">
             <button class="orbit-disc" onclick="openWindow('More')">More</button>
        </div>
        <div class="disc-wrapper pos-5">
            <button class="orbit-disc" onclick="openWindow('Teaching')">Teaching</button>
        </div>
        <div class="disc-wrapper pos-6">
	    <button class="orbit-disc" onclick="openWindow('Presentations')">Presentations</button>
        </div>
    </div>

<!-- Floating Social Icons (Bottom Right) -->
    <div class="floating-socials">
        <a href="mailto:Dimitrios.Tsintsilidas@warwick.ac.uk" class="social-icon" title="Email">
            <i class="fa-solid fa-envelope"></i>
        </a>
        <a href="https://scholar.google.com/citations?user=dvqi49MAAAAJ&hl=en" target="_blank" class="social-icon" title="Google Scholar">
            <i class="ai ai-google-scholar"></i>
        </a>
        <a href="https://orcid.org/0009-0006-4180-0348" target="_blank" class="social-icon" title="ORCID">
            <i class="ai ai-orcid"></i>
        </a>
    </div>

    <!-- Modal Window -->
    <div id="content-window" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeWindow()">&times;</span>
            <h2 id="window-title">Title</h2>
            <div id="window-body">
                <p>Your content will load here.</p>
            </div>
        </div>
    </div>

    <!-- Link to your JavaScript file -->
    <script src="script.js" defer></script>
</body>
</html>
