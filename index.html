<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrios Tsintsilidas Webpage</title>
    <link rel="stylesheet" href="style.css">

    <!-- MathJax for LaTeX support -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Icon Libraries for Email, Scholar, and ORCID -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <!-- Redesign experiment: shallow curved navigation + persistent content stage -->
    <style>
        .main-title {
            top: 14px;
            left: 28px;
            font-size: clamp(1.12rem, 2.2vw, 1.78rem);
            z-index: 30;
        }

        .radial-nav-container {
            position: fixed;
            top: 34px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1180px, 96vw);
            height: 140px;
            z-index: 20;
            display: block;
            pointer-events: none;
        }

        .orbit-path {
            display: none;
        }

        .orbit-arc {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .orbit-arc path {
            fill: none;
            stroke: rgba(200, 180, 220, 0.4);
            stroke-width: 2.4;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 0 8px rgba(200, 180, 220, 0.1));
        }

        .disc-wrapper {
            position: absolute;
            z-index: 3;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }

        /* These centres are sampled directly from the SVG curve below. */
        .pos-1 { left: 7%;  top: 76.5%; }
        .pos-2 { left: 24%; top: 55%; }
        .pos-3 { left: 41%; top: 43%; }
        .pos-4 { left: 59%; top: 43%; }
        .pos-5 { left: 76%; top: 55%; }
        .pos-6 { left: 93%; top: 76.5%; }

        .orbit-disc {
            width: clamp(96px, 12.5vmin, 126px);
            height: clamp(96px, 12.5vmin, 126px);
            min-width: 0;
            min-height: 0;
            padding: 11px;
            border-radius: 50%;
            background: linear-gradient(135deg, #262D66 0%, #4F2F49 100%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            box-shadow:
                0 9px 25px rgba(0, 0, 0, 0.34),
                inset 0 0 10px rgba(255, 255, 255, 0.07);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: clamp(0.72rem, 1.35vw, 0.98rem);
            letter-spacing: 0.025em;
            line-height: 1.12;
            cursor: pointer;
            transition:
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }

        .orbit-disc:hover {
            transform: scale(1.045);
            background: linear-gradient(135deg, #613985, #42275a);
            border-color: rgba(255, 255, 255, 0.7);
            color: #fff;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.33),
                0 0 24px rgba(200, 150, 255, 0.24);
        }

        .orbit-disc.active {
            background: linear-gradient(135deg, #613985, #42275a);
            border-color: rgba(255, 255, 255, 0.78);
            color: #fff;
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.36),
                0 0 26px rgba(200, 150, 255, 0.28),
                inset 0 0 10px rgba(255, 255, 255, 0.08);
        }

        .orbit-disc:active {
            transform: scale(0.985);
        }

        /* Persistent centre stage, using the original site's translucent dark treatment. */
        .modal {
            display: flex;
            position: fixed;
            top: 198px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1020px, calc(100vw - 72px));
            height: calc(100vh - 226px);
            background: transparent;
            backdrop-filter: none;
            z-index: 12;
            justify-content: center;
            align-items: stretch;
            pointer-events: none;
        }

        .modal-content {
            width: 100%;
            max-width: none;
            max-height: none;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: clamp(20px, 2.6vw, 32px);
            border-radius: 18px;
            background: rgba(11, 14, 20, 0.8);
            border: 1px solid rgba(200, 180, 220, 0.3);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.55);
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            text-align: left;
            color: #edf2fa;
            animation: none;
            pointer-events: auto;
        }

        #window-title {
            margin: 0 0 14px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(200, 180, 220, 0.2);
            font-size: clamp(1.35rem, 2.35vw, 1.9rem);
            letter-spacing: 0.01em;
        }

        .close-btn {
            display: none;
        }

        .about-container {
            flex-direction: row;
            align-items: center;
            gap: clamp(20px, 3vw, 40px);
            margin-top: 0;
        }

        .profile-pic {
            width: clamp(138px, 17vw, 190px);
            height: clamp(184px, 23vw, 255px);
            flex: 0 0 auto;
            border-width: 2px;
        }

        .about-text {
            text-align: left;
            max-width: 680px;
            font-size: clamp(0.84rem, 1.45vw, 1rem);
            line-height: 1.48;
        }

        .about-text p {
            margin: 0 0 0.78em;
        }

        .about-actions {
            margin-top: 14px;
            gap: 10px;
        }

        .action-btn, .action-btn:visited {
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .floating-socials {
            z-index: 30;
        }

        @media (max-width: 820px) {
            .radial-nav-container {
                top: 44px;
                width: 100vw;
                height: 126px;
            }

            .pos-1 { left: 8%;  top: 76%; }
            .pos-2 { left: 25%; top: 56%; }
            .pos-3 { left: 42%; top: 45%; }
            .pos-4 { left: 58%; top: 45%; }
            .pos-5 { left: 75%; top: 56%; }
            .pos-6 { left: 92%; top: 76%; }

            .orbit-disc {
                width: clamp(64px, 15vw, 84px);
                height: clamp(64px, 15vw, 84px);
                padding: 6px;
                font-size: clamp(0.5rem, 1.85vw, 0.7rem);
            }

            .modal {
                top: 182px;
                width: calc(100vw - 28px);
                height: calc(100vh - 206px);
            }

            .modal-content {
                padding: 18px 16px 22px;
                border-radius: 15px;
            }

            .about-container {
                flex-direction: column;
                align-items: center;
                gap: 14px;
            }

            .about-text {
                width: 100%;
                font-size: 0.84rem;
                line-height: 1.45;
            }

            .profile-pic {
                width: 118px;
                height: 158px;
            }
        }

        @media (max-width: 520px) {
            .main-title {
                top: 12px;
                left: 18px;
                font-size: 1.08rem;
            }

            .radial-nav-container {
                top: 43px;
                height: 112px;
            }

            .orbit-arc path {
                stroke-width: 2;
            }

            .orbit-disc {
                width: 58px;
                height: 58px;
                font-size: 0.49rem;
                padding: 4px;
            }

            .modal {
                top: 166px;
                height: calc(100vh - 184px);
                width: calc(100vw - 18px);
            }
        }
    </style>
</head>
<body>

    <h1 class="main-title">Dimitrios Tsintsilidas</h1>

    <canvas id="particle-canvas"></canvas>

    <!-- Shallow curved navigation: ordered from About to More -->
    <div class="radial-nav-container" aria-label="Main navigation">
        <svg class="orbit-arc" viewBox="0 0 1200 140" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 70 110 Q 600 8 1130 110" />
        </svg>

        <div class="disc-wrapper pos-1">
            <button type="button" class="orbit-disc" data-section="About" onclick="openWindow('About')">About</button>
        </div>
        <div class="disc-wrapper pos-2">
            <button type="button" class="orbit-disc" data-section="Research" onclick="openWindow('Research')">Research</button>
        </div>
        <div class="disc-wrapper pos-3">
            <button type="button" class="orbit-disc" data-section="Publications" onclick="openWindow('Publications')">Publications</button>
        </div>
        <div class="disc-wrapper pos-4">
            <button type="button" class="orbit-disc" data-section="Presentations" onclick="openWindow('Presentations')">Presentations</button>
        </div>
        <div class="disc-wrapper pos-5">
            <button type="button" class="orbit-disc" data-section="Teaching" onclick="openWindow('Teaching')">Teaching</button>
        </div>
        <div class="disc-wrapper pos-6">
            <button type="button" class="orbit-disc" data-section="More" onclick="openWindow('More')">More</button>
        </div>
    </div>

    <div class="floating-socials">
        <a href="mailto:Dimitrios.Tsintsilidas@warwick.ac.uk" class="social-icon" title="Email">
            <i class="fa-solid fa-envelope"></i>
        </a>
        <a href="https://scholar.google.com/citations?user=dvqi49MAAAAJ&hl=en" target="_blank" class="social-icon" title="Google Scholar">
            <i class="ai ai-google-scholar"></i>
        </a>
        <a href="https://orcid.org/0009-0006-4180-0348" target="_blank" class="social-icon" title="ORCID">
            <i class="ai ai-orcid"></i>
        </a>
    </div>

    <!-- Persistent central content screen; About is loaded by default in script.js -->
    <div id="content-window" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeWindow()">&times;</span>
            <h2 id="window-title">About</h2>
            <div id="window-body">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
