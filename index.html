<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dimitrios Tsintsilidas Webpage</title>
    <link rel="stylesheet" href="style.css">

    <!-- MathJax for LaTeX support -->
    <script>
        MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']]
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <!-- Icon Libraries for Email, Scholar, and ORCID -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

    <!-- Redesign experiment: opened orbit + persistent central content -->
    <style>
        .main-title {
            top: 18px;
            left: 28px;
            font-size: clamp(1.15rem, 2.4vw, 1.9rem);
            z-index: 30;
        }

        .radial-nav-container {
            position: fixed;
            top: 42px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1180px, 96vw);
            height: 190px;
            z-index: 20;
            display: block;
            pointer-events: none;
        }

        .orbit-path {
            display: none;
        }

        .orbit-arc {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
            pointer-events: none;
        }

        .orbit-arc path {
            fill: none;
            stroke: rgba(154, 178, 255, 0.23);
            stroke-width: 1.35;
            vector-effect: non-scaling-stroke;
            filter: drop-shadow(0 0 8px rgba(130, 160, 255, 0.06));
        }

        .disc-wrapper {
            position: absolute;
            z-index: 3;
            transform: translate(-50%, -50%);
            pointer-events: auto;
        }

        .pos-1 { left: 7%;  top: 79%; }
        .pos-2 { left: 24%; top: 46%; }
        .pos-3 { left: 41%; top: 27%; }
        .pos-4 { left: 59%; top: 27%; }
        .pos-5 { left: 76%; top: 46%; }
        .pos-6 { left: 93%; top: 79%; }

        .orbit-disc {
            width: clamp(84px, 10vmin, 112px);
            height: clamp(84px, 10vmin, 112px);
            min-width: 0;
            min-height: 0;
            padding: 10px;
            border-radius: 50%;
            background: linear-gradient(145deg, rgba(35, 43, 72, 0.96), rgba(39, 31, 53, 0.96));
            border: 1px solid rgba(175, 190, 235, 0.18);
            color: rgba(237, 242, 250, 0.88);
            box-shadow:
                0 8px 24px rgba(0, 0, 0, 0.30),
                inset 0 1px 0 rgba(255, 255, 255, 0.035);
            font-family: 'Nunito', sans-serif;
            font-weight: 800;
            font-size: clamp(0.66rem, 1.25vw, 0.94rem);
            letter-spacing: 0.025em;
            line-height: 1.15;
            cursor: pointer;
            transition:
                transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
                background 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }

        .orbit-disc:hover {
            transform: scale(1.055);
            background: linear-gradient(145deg, rgba(45, 55, 92, 0.99), rgba(55, 38, 69, 0.99));
            border-color: rgba(180, 196, 255, 0.42);
            color: #fff;
            box-shadow:
                0 12px 30px rgba(0, 0, 0, 0.33),
                0 0 18px rgba(130, 160, 255, 0.10);
        }

        .orbit-disc.active {
            background: linear-gradient(145deg, rgba(57, 70, 118, 0.99), rgba(69, 44, 85, 0.99));
            border-color: rgba(178, 198, 255, 0.68);
            color: #fff;
            box-shadow:
                0 12px 32px rgba(0, 0, 0, 0.34),
                0 0 24px rgba(130, 160, 255, 0.16),
                inset 0 1px 0 rgba(255, 255, 255, 0.06);
        }

        .orbit-disc:active {
            transform: scale(0.985);
        }

        /* Persistent centre stage. The old modal machinery is reused as a screen. */
        .modal {
            display: flex;
            position: fixed;
            top: 224px;
            left: 50%;
            transform: translateX(-50%);
            width: min(1080px, calc(100vw - 64px));
            height: calc(100vh - 274px);
            background: transparent;
            backdrop-filter: none;
            z-index: 12;
            justify-content: center;
            align-items: stretch;
            pointer-events: none;
        }

        .modal-content {
            width: 100%;
            max-width: none;
            max-height: none;
            height: 100%;
            box-sizing: border-box;
            overflow-y: auto;
            padding: clamp(24px, 3.2vw, 42px);
            border-radius: 20px;
            background:
                linear-gradient(145deg, rgba(19, 24, 37, 0.91), rgba(15, 17, 26, 0.86));
            border: 1px solid rgba(169, 185, 230, 0.16);
            box-shadow:
                0 24px 70px rgba(0, 0, 0, 0.34),
                inset 0 1px 0 rgba(255, 255, 255, 0.025);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            text-align: left;
            color: #edf2fa;
            animation: none;
            pointer-events: auto;
        }

        #window-title {
            margin: 0 0 22px;
            padding-bottom: 14px;
            border-bottom: 1px solid rgba(169, 185, 230, 0.12);
            font-size: clamp(1.45rem, 2.8vw, 2.2rem);
            letter-spacing: 0.01em;
        }

        .close-btn {
            display: none;
        }

        .about-container {
            flex-direction: row;
            align-items: center;
            gap: clamp(24px, 4vw, 52px);
            margin-top: 0;
        }

        .profile-pic {
            width: clamp(150px, 20vw, 230px);
            height: clamp(200px, 27vw, 310px);
            flex: 0 0 auto;
        }

        .about-text {
            text-align: left;
            max-width: 700px;
        }

        .floating-socials {
            z-index: 30;
        }

        @media (max-width: 820px) {
            .radial-nav-container {
                top: 50px;
                width: 100vw;
                height: 155px;
            }

            .pos-1 { left: 8%;  top: 78%; }
            .pos-2 { left: 25%; top: 48%; }
            .pos-3 { left: 42%; top: 32%; }
            .pos-4 { left: 58%; top: 32%; }
            .pos-5 { left: 75%; top: 48%; }
            .pos-6 { left: 92%; top: 78%; }

            .orbit-disc {
                width: clamp(58px, 14vw, 78px);
                height: clamp(58px, 14vw, 78px);
                padding: 6px;
                font-size: clamp(0.48rem, 1.75vw, 0.68rem);
            }

            .modal {
                top: 198px;
                width: calc(100vw - 28px);
                height: calc(100vh - 226px);
            }

            .modal-content {
                padding: 20px 18px 24px;
                border-radius: 16px;
            }

            .about-container {
                flex-direction: column;
                align-items: center;
                gap: 18px;
            }

            .about-text {
                width: 100%;
            }

            .profile-pic {
                width: 130px;
                height: 175px;
            }
        }

        @media (max-width: 520px) {
            .main-title {
                top: 14px;
                left: 18px;
                font-size: 1.12rem;
            }

            .radial-nav-container {
                top: 48px;
                height: 132px;
            }

            .orbit-disc {
                width: 54px;
                height: 54px;
                font-size: 0.48rem;
                padding: 4px;
            }

            .modal {
                top: 178px;
                height: calc(100vh - 196px);
                width: calc(100vw - 20px);
            }
        }
    </style>
</head>
<body>

    <h1 class="main-title">Dimitrios Tsintsilidas</h1>

    <canvas id="particle-canvas"></canvas>

    <!-- Opened curved navigation: ordered from About to More -->
    <div class="radial-nav-container" aria-label="Main navigation">
        <svg class="orbit-arc" viewBox="0 0 1200 220" preserveAspectRatio="none" aria-hidden="true">
            <path d="M 70 180 Q 600 -4 1130 180" />
        </svg>

        <div class="disc-wrapper pos-1">
            <button type="button" class="orbit-disc" data-section="About" onclick="openWindow('About')">About</button>
        </div>
        <div class="disc-wrapper pos-2">
            <button type="button" class="orbit-disc" data-section="Research" onclick="openWindow('Research')">Research</button>
        </div>
        <div class="disc-wrapper pos-3">
            <button type="button" class="orbit-disc" data-section="Publications" onclick="openWindow('Publications')">Publications</button>
        </div>
        <div class="disc-wrapper pos-4">
            <button type="button" class="orbit-disc" data-section="Presentations" onclick="openWindow('Presentations')">Presentations</button>
        </div>
        <div class="disc-wrapper pos-5">
            <button type="button" class="orbit-disc" data-section="Teaching" onclick="openWindow('Teaching')">Teaching</button>
        </div>
        <div class="disc-wrapper pos-6">
            <button type="button" class="orbit-disc" data-section="More" onclick="openWindow('More')">More</button>
        </div>
    </div>

    <div class="floating-socials">
        <a href="mailto:Dimitrios.Tsintsilidas@warwick.ac.uk" class="social-icon" title="Email">
            <i class="fa-solid fa-envelope"></i>
        </a>
        <a href="https://scholar.google.com/citations?user=dvqi49MAAAAJ&hl=en" target="_blank" class="social-icon" title="Google Scholar">
            <i class="ai ai-google-scholar"></i>
        </a>
        <a href="https://orcid.org/0009-0006-4180-0348" target="_blank" class="social-icon" title="ORCID">
            <i class="ai ai-orcid"></i>
        </a>
    </div>

    <!-- Persistent central content screen; About is loaded by default in script.js -->
    <div id="content-window" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeWindow()">&times;</span>
            <h2 id="window-title">About</h2>
            <div id="window-body">
                <p>Loading...</p>
            </div>
        </div>
    </div>

    <script src="script.js" defer></script>
</body>
</html>
